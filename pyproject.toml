[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-guard"
version = "1.18"
description = "Generate and enforce Git branch-flow policies from Mermaid gitGraph documents."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "git-guard contributors" }
]
dependencies = []

[project.scripts]
git-guard = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["cli", "install", "mermaid"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["runtime", "git_guard_assets"]
